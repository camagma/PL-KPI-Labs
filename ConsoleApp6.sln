using System.IO;
string[] names = { "Олег", "Марія", "Степан", "Ірина", "Антон", "Софія", "Павло", "Катерина", "Дмитро", "Олена" };
string[] surnames = { "Коваленко", "Сидорук", "Ткаченко", "Гуменюк", "Романів", "Федорчук", "Мельник", "Шевчук" };
string[] groups = { "A-1", "B-2", "C-3", "D-4" };
List<string> students = new List<string>();
students.AddRange(names);
students.AddRange(surnames);
students.AddRange(groups);
string path = Console.ReadLine();
string filePath = Path.Combine(path, "students.txt");
try
{
    using (StreamWriter sw = new StreamWriter(filePath))
    {
        foreach(var student in students)
        {
            sw.WriteLine(student);
        }
    }
}
catch (Exception ex)
{
    Console.WriteLine("Помилка при записі файлу: " + ex.Message);
}
Console.WriteLine(File.ReadAllText("students.txt"));
